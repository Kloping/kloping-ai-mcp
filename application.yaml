top.kloping.ai.mcp:
  servers:
    # 自定义 mcp server名字
    WebSearch:
      server: https://dashscope.aliyuncs.com
      endpoint: /api/v1/mcps/WebSearch/sse
      token: sk-xxxxxxx
      heartbeat: 45
    WebParser:
      server: ${top.kloping.ai.mcp.servers.WebSearch.server}
      endpoint: /api/v1/mcps/WebParser/sse
      token: ${top.kloping.ai.mcp.servers.WebSearch.token}
      heartbeat: 45
logging:
  pattern:
    console: "%clr([%thread]){blue} %clr(%-32.32logger{32}){magenta} %clr(%d{yyyy-MM-dd HH:mm:ss}){red} %clr(%-5p): %msg%n"
    file: "[%thread] %-32.32logger{32} %d{yyyy-MM-dd HH:mm:ss} %-5p: %msg%n"
  file:
    # 输出的log文件名
    name: ./logs/slf4j.log
    # 输出的文件的路径
    path: logs
    # 限制日志文件的大小
    max-size: 10MB
    # 日志的保存天数
    max-history: 7
  level:
    # 输出级别
    root: INFO
    # 特定的mapper下的输出级别
    top.kloping.core.ai.*: DEBUG